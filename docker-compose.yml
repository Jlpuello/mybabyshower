version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: babyshower-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: babyshower
      POSTGRES_PASSWORD: password
      POSTGRES_DB: babyshower
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babyshower"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
